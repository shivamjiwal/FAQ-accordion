<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- displays site properly based on user's device -->
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="./assets/images/favicon-32x32.png"
        >
        <link rel="stylesheet" href="style.css">
        <title>Frontend Mentor | FAQ accordion</title>
        <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
        <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
        </style>
    </head>
    <body>
        <main>
            <section class = "section">
                <div class="heading">
                    <h1>
                        <img src="icon-star.svg" alt="a purple color star">
                        FAQs
                    </h1>
                </div>
                <div class="question">
                    <p>What is Frontend Mentor, and how will it help me?</p>
                    <img class="plus-icon" src="icon-plus.svg" alt="a white colur plus sign within a purple background colour">
                </div>
            </section>
            <section class = "section">
                <div class="question">
                    <p>Is Frontend Mentor free?</p>
                    <img class="plus-icon" src="icon-plus.svg" alt="a white colur plus sign within a purple background colour">
                </div>
            </section>
            <section class = "section">
                <div class="question">
                    <p>Can I use Frontend Mentor projects in my portfolio?</p>
                    <img class="plus-icon" src="icon-plus.svg" alt="a white colur plus sign within a purple background colour">
                </div>
            </section>
            <section class = "section">
                <div class="question">
                    <p> How can I get help if I'm stuck on a Frontend Mentor challenge?</p>
                    <img class="plus-icon" src="icon-plus.svg" alt="a white colur plus sign within a purple background colour">
                </div>
            </section>
        </main>
        <script src="index.js"></script>
    </body>
</html>
